<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Navigation for the UI/UX learning workspace">
<title>Sign in | UI/UX Learning</title>
<style>
:root {
  --blue-700:#1868db; --blue-800:#0055cc; --blue-900:#09326c;
  --white:#fff; --surface:#f7f8f9; --border:#dcdfe4;
  --text:#172b4d; --muted:#44546f; --selected:#e9f2ff;
  --space-100:8px; --space-200:16px; --space-300:24px; --space-400:32px;
  --rail:280px; --header:64px;
  font:400 14px/20px "Atlassian Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--white); }
a { color:var(--blue-700); }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--blue-700); outline-offset:2px; }
.skip { position:fixed; z-index:5; top:8px; left:8px; padding:8px 16px; background:var(--white); transform:translateY(-150%); }
.skip:focus { transform:none; }
.icons { position:absolute; width:0; height:0; overflow:hidden; }
.icon { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.top { height:var(--header); position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--white); }
.top-start,.brand,.top-link { display:flex; align-items:center; gap:8px; text-decoration:none; }
.brand { gap:12px; font-size:16px; font-weight:600; color:var(--text); }
.brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:6px; background:var(--blue-700); color:var(--white); }
.top-link { min-height:44px; padding:0 8px; border-radius:4px; font-weight:500; color:var(--muted); }
.top-link:hover { background:var(--surface); color:var(--blue-800); }
.top-link[aria-current="page"] { color:var(--blue-900); background:var(--selected); }
.icon-button { display:grid; place-items:center; width:44px; height:44px; border:0; border-radius:4px; background:transparent; color:var(--muted); }
.icon-button:hover { background:var(--surface); }
.menu-trigger { display:none; }
.shell { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:calc(100dvh - var(--header)); }
.rail { position:sticky; top:var(--header); align-self:start; height:calc(100dvh - var(--header)); overflow:auto; background:var(--surface); border-right:1px solid var(--border); }
.rail nav { padding:24px 16px; }
.group + .group { border-top:1px solid var(--border); margin-top:24px; padding-top:24px; }
.group-title { margin:0 8px 8px; color:var(--muted); font-size:12px; line-height:16px; font-weight:600; }
.nav-list { list-style:none; padding:0; margin:0; }
.nav-row { position:relative; display:flex; align-items:center; gap:8px; min-height:44px; padding:8px; border-radius:4px; color:var(--text); text-decoration:none; }
.nav-row:hover { background:#eef0f2; }
.nav-row[aria-current="page"] { background:var(--selected); color:var(--blue-900); font-weight:600; }
.nav-row[aria-current="page"]::before { content:""; position:absolute; inset:8px auto 8px 0; width:3px; border-radius:2px; background:var(--blue-700); }
summary { list-style:none; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary .chevron { margin-left:auto; width:16px; height:16px; }
details[open] .chevron { transform:rotate(90deg); }
.module-list { margin:0 0 0 17px; padding-left:12px; border-left:1px solid var(--border); }
.module-list .nav-row { font-size:13px; }
.module-number { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
main { padding:40px clamp(16px,5vw,72px); }
.breadcrumb { display:flex; align-items:center; flex-wrap:wrap; gap:8px; color:var(--muted); margin-bottom:16px; }
.breadcrumb .icon { width:12px; height:12px; }
h1 { font-size:29px; line-height:32px; font-weight:600; margin:0 0 8px; }
main p { margin:0; color:var(--muted); }
.roadmap { max-width:920px; margin-top:24px; }
.path-overview { padding:24px; border:1px solid var(--border); border-top:3px solid var(--blue-700); border-radius:8px; background:var(--surface); }
.roadmap h2 { margin:0 0 8px; font-size:20px; line-height:24px; font-weight:500; }
.path-overview p { max-width:64ch; }
.path-facts { display:flex; flex-wrap:wrap; gap:8px 24px; padding:0; margin:16px 0 0; list-style:none; font-size:12px; }
.path-facts li { color:var(--muted); }
.path-facts strong { color:var(--text); }
.roadmap section + section { margin-top:32px; }
.checkpoint-map {
  --grid:rgba(24,104,219,.10);
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(248px,32%);
  align-items:center;
  gap:24px;
  padding:24px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:8px;
  background:#f4f8ff;
}
.checkpoint-map::before,.checkpoint-map::after { content:""; position:absolute; pointer-events:none; z-index:-1; }
.checkpoint-map::before {
  inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(112deg,#000,rgba(0,0,0,.25));
}
.checkpoint-map::after {
  inset:-30%;
  background:radial-gradient(ellipse at 30% 45%,rgba(89,153,255,.23),transparent 37%),radial-gradient(ellipse at 67% 62%,rgba(89,153,255,.12),transparent 32%);
  animation:map-drift 16s ease-in-out infinite alternate;
}
@keyframes map-drift { to { transform:translate3d(8%,-7%,0); opacity:.6; } }
.checkpoint-field { position:relative; padding:0 12px; }
.checkpoint-track { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.checkpoint-track path { fill:none; stroke-linecap:round; }
.track-line { stroke:var(--blue-700); stroke-opacity:.42; stroke-width:1.5; }
.track-pulse { stroke:#087bfb; stroke-width:2; stroke-dasharray:7 93; stroke-dashoffset:7; filter:drop-shadow(0 0 3px #388bff); animation:track-pulse 5s linear infinite; }
@keyframes track-pulse {
  0% { stroke-dashoffset:7; opacity:0; }
  7%, 82% { opacity:.8; }
  92%, 100% { stroke-dashoffset:-93; opacity:0; }
}
.checkpoints { position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:32px 8px; padding:0; margin:0; list-style:none; }
.checkpoints li:nth-child(even) { transform:translateY(12px); }
@media (min-width:481px) {
  .checkpoints li:nth-child(5) { grid-area:2 / 4; }
  .checkpoints li:nth-child(6) { grid-area:2 / 3; }
  .checkpoints li:nth-child(7) { grid-area:2 / 2; }
  .checkpoints li:nth-child(8) { grid-area:2 / 1; }
}
.checkpoint { display:grid; justify-items:center; align-content:start; gap:8px; width:100%; min-height:104px; padding:4px; border:0; border-radius:6px; background:transparent; text-align:center; }
.checkpoint-number { display:grid; place-items:center; width:44px; height:44px; border:1px solid #85b8ff; border-radius:12px; background:var(--white); color:var(--blue-900); font-weight:600; font-variant-numeric:tabular-nums; box-shadow:0 2px 6px rgba(9,50,108,.10); transition:background .16s,color .16s,transform .16s; }
.checkpoint-label { font-size:12px; line-height:16px; font-weight:500; overflow-wrap:anywhere; }
.checkpoint[aria-current="true"] .checkpoint-number { background:var(--blue-900); border-color:var(--blue-900); color:var(--white); box-shadow:0 0 0 4px rgba(24,104,219,.16); }
.checkpoint:hover .checkpoint-number { border-color:var(--blue-700); }
.checkpoint-details { display:grid; min-width:0; align-self:stretch; }
.checkpoint-detail { grid-area:1 / 1; visibility:hidden; align-self:stretch; display:grid; align-content:center; gap:16px; min-height:280px; padding:24px; background:var(--white); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(9,50,108,.09); }
.checkpoint-detail.is-active { visibility:visible; }
.checkpoint-detail h3 { margin:4px 0 0; font-size:20px; line-height:24px; font-weight:500; }
.checkpoint-detail .detail-index { font-size:12px; line-height:16px; font-weight:600; }
.detail-work { border-top:1px solid var(--border); padding-top:12px; }
.detail-work strong { display:block; color:var(--text); font-size:12px; }
.course-cta { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 16px; color:var(--white); background:var(--blue-700); border-radius:4px; text-decoration:none; font-weight:600; }
.course-cta:hover { background:var(--blue-800); }
.course-cta:active { background:var(--blue-900); }
@media (max-width:1120px) {
  .checkpoint-map { grid-template-columns:minmax(0,1fr); }
  .checkpoint-detail { min-height:0; }
}
@media (max-width:480px) {
  .checkpoint-map { padding:16px; gap:16px; }
  .checkpoints { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .checkpoints li:nth-child(even) { transform:none; }
  .checkpoints li:nth-child(3) { grid-area:2 / 2; }
  .checkpoints li:nth-child(4) { grid-area:2 / 1; }
  .checkpoints li:nth-child(7) { grid-area:4 / 2; }
  .checkpoints li:nth-child(8) { grid-area:4 / 1; }
  .checkpoint { min-height:80px; }
  .checkpoint-detail { padding:16px; }
}
@media (prefers-reduced-motion:reduce) {
  .checkpoint-map::after { animation:none; }
  .checkpoint-number { transition:none; }
  .track-pulse { display:none; }
}
.curriculum-notes { border-top:1px solid var(--border); padding-top:16px; }
.curriculum-notes summary { display:flex; align-items:center; gap:8px; min-height:44px; font-weight:600; width:fit-content; }
.curriculum-notes ul { padding-left:20px; display:grid; gap:8px; }
.module-plan { display:grid; gap:16px; max-width:640px; }
.module-plan a { width:fit-content; }
@media (max-width:480px) {
  .path-overview { padding:16px; }
}
dialog { position:fixed; inset:0 auto 0 0; margin:0; padding:0; border:0; width:min(320px,calc(100% - 32px)); height:100%; max-height:none; max-width:none; background:var(--surface); color:var(--text); }
dialog[open] { display:flex; flex-direction:column; }
dialog::backdrop { background:rgb(9 30 66 / 50%); }
.drawer-head { flex:none; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; background:var(--white); border-bottom:1px solid var(--border); }
.drawer-head h2 { margin:0; font-size:20px; line-height:24px; font-weight:500; }
dialog nav { padding:16px; overflow:auto; }
body:has(dialog[open]) { overflow:hidden; }
@media (max-width:767px) {
  .top { padding:0 8px; }
  .top-start { gap:4px; }
  .menu-trigger { display:grid; }
  .shell { display:block; }
  .rail { display:none; }
  main { padding:24px 16px; }
}
.foundation { max-width:900px; margin-top:24px; }
.foundation-overview,.foundation-panel { border:1px solid var(--border); border-radius:8px; padding:24px; }
.foundation-overview { background:var(--surface); border-top:3px solid var(--blue-700); }
.foundation h2 { font-size:24px; line-height:28px; font-weight:500; margin:0 0 8px; }
.foundation h3 { font-size:20px; line-height:24px; font-weight:500; margin:0 0 8px; }
.foundation-progress { display:grid; gap:8px; margin-top:16px; max-width:360px; }
.foundation-progress progress { width:100%; height:12px; accent-color:var(--blue-700); }
.foundation-steps { display:flex; gap:8px; flex-wrap:wrap; padding:0; margin:16px 0; list-style:none; }
.foundation-steps button,.lesson-toggle { min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:4px; background:var(--white); }
.foundation-steps button:hover,.lesson-toggle:hover { background:var(--surface); }
.foundation-steps button[aria-current="step"] { color:var(--blue-900); background:var(--selected); border-color:var(--blue-700); font-weight:600; }
.foundation-panel > * + *, .foundation-panel form > * + * { margin-top:16px; }
.foundation-panel .course-cta { border:0; width:fit-content; }
.foundation-practice { padding:16px; background:var(--surface); border-left:3px solid var(--blue-700); }
.foundation-reading,.foundation-example { padding:16px; border:1px solid var(--border); border-radius:4px; }
.foundation-reading p + p { margin-top:8px; }
.foundation-example summary { min-height:24px; color:var(--blue-800); font-weight:600; }
.foundation-example ul,.foundation-panel ol { padding-inline-start:24px; }
.foundation-panel li + li { margin-top:4px; }
.foundation-panel fieldset { min-width:0; padding:12px 16px; border:1px solid var(--border); border-radius:4px; }
.foundation-panel legend { max-width:100%; font-weight:600; }
.quiz-option { display:flex; align-items:center; gap:8px; min-height:40px; }
.foundation-panel input[type=radio],.foundation-panel input[type=checkbox] { accent-color:var(--blue-700); }
.foundation-panel textarea,.foundation-panel select { display:block; width:100%; margin-top:8px; padding:8px; border:1px solid var(--muted); border-radius:4px; background:var(--white); color:var(--text); font:inherit; }
.foundation-panel textarea { resize:vertical; }
.foundation-panel textarea:disabled { opacity:.65; }
.quiz-feedback { margin-top:8px; }
.foundation-status { min-height:20px; }
@media (max-width:600px) {
  .foundation-overview,.foundation-panel { padding:16px; }
  .foundation-panel fieldset { padding:8px; }
}
[hidden] { display:none !important; }
.sign-in { margin:clamp(24px,10vh,96px) auto; width:calc(100% - 32px); max-width:440px; display:grid; gap:16px; padding:24px; border:1px solid var(--border); border-top:3px solid var(--blue-700); border-radius:8px; }
.sign-in p,.sign-in h1 { margin:0; }
.sign-in form { display:grid; gap:8px; }
.sign-in input { min-width:0; width:100%; padding:12px; border:1px solid var(--muted); border-radius:4px; font:inherit; }
.sign-in button,#sign-out { border:none; }
#sign-out { background:var(--surface); white-space:nowrap; }
@media (max-width:425px) { .top { gap:4px; } .top-link .icon { display:none; } .brand { gap:4px; font-size:14px; } .top-link { padding:0 4px; } }
.assignment-brief { white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
</head>
<body>
<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="book" viewBox="0 0 24 24"><path d="M12 5.5C9 3.5 5.5 3.5 3 4v14c3-.5 6-.5 9 1.5 3-2 6-2 9-1.5V4c-2.5-.5-6-.5-9 1.5Zm0 0v14"/></symbol>
  <symbol id="dashboard" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  <symbol id="course" viewBox="0 0 24 24"><path d="M3 6h3m-3 6h3m-3 6h3M9 6h12M9 12h12M9 18h12"/></symbol>
  <symbol id="resources-icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8m-8 4h8m-8 4h5"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>
<a class="skip" hidden href="#main">Skip to content</a>
<header class="top" hidden>
  <div class="top-start">
    <button class="icon-button menu-trigger" type="button" aria-label="Open navigation" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#menu"/></svg></button>
    <a class="brand" href="#dashboard"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#book"/></svg></span>UI/UX Learning</a>
  </div>
  <a class="top-link" href="#resources"><svg class="icon" aria-hidden="true"><use href="#resources-icon"/></svg>Resources</a>
  <button class="top-link" type="button" id="sign-out">Sign out</button>
</header>
<section id="login" class="sign-in" aria-labelledby="sign-in-title">
  <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#book"/></svg></span>
  <h1 id="sign-in-title">Sign in to UI/UX Learning</h1>
  <p>Use the email address your administrator invited.</p>
  <form>
    <label for="login-email">Email address</label>
    <input type="email" id="login-email" name="email" autocomplete="email" required>
    <button class="course-cta" disabled>Send sign-in link</button>
  </form>
  <p role="status"></p>
</section>
<div class="shell" hidden>
  <aside class="rail"><nav aria-label="Course navigation"></nav></aside>
  <main id="main" tabindex="-1">
    <div class="breadcrumb" aria-label="Current location"></div>
    <h1>Dashboard</h1>
    <p id="page-description"></p>
    <div id="page-content"></div>
  </main>
</div>
<dialog id="drawer" aria-labelledby="drawer-title">
  <header class="drawer-head"><h2 id="drawer-title">Navigation</h2><form method="dialog"><button type="submit" class="icon-button" aria-label="Close navigation" autofocus><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button></form></header>
  <nav aria-label="Course navigation"></nav>
</dialog>
<script>
let modules = [];
const curriculumReferences = [
  ['University of Michigan', 'User Experience Research and Design', 'https://online.umich.edu/series/user-experience-research-and-design/'],
  ['Stanford d.school', 'Design Thinking Bootleg', 'https://dschool.stanford.edu/tools/design-thinking-bootleg'],
  ['Carnegie Mellon HCII', 'User-Centered Research and Evaluation', 'https://www.hcii.cmu.edu/course/user-centered-research-and-evaluation-ucre'],
  ['Google', 'UX Design Certificate curriculum', 'https://grow.google/certificates/ux-design/']
];
let pages = new Map();
const buildPages = () => new Map([
  ['dashboard', ['Dashboard', 'The dashboard is the next build.']],
  ['roadmap', ['Course roadmap', 'Go from your first usability critique to a tested design and portfolio case study.']],
  ['resources', ['Resources', 'The resource library will be added with the course content.']],
  ...modules.map(({ title, skills }, index) => ['module-' + (index + 1), [title, skills]])
]);
const icon = (id, extra = '') => '<svg class="icon ' + extra + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
const navigation = document.querySelectorAll('nav');
const main = document.querySelector('main');
const drawer = document.querySelector('dialog');
const trigger = document.querySelector('.menu-trigger');
const mobile = matchMedia('(max-width: 767px)');

function buildNavigation() {
for (const nav of navigation) {
  nav.innerHTML = `
    <div class="group">
      <p class="group-title">Workspace</p>
      <ul class="nav-list">
        <li><a class="nav-row" href="#dashboard">${icon('dashboard')}Dashboard</a></li>
        <li><a class="nav-row" href="#roadmap">${icon('course')}Course roadmap</a></li>
      </ul>
    </div>
    <div class="group">
      <p class="group-title">Course outline</p>
      <details open>
        <summary class="nav-row">${icon('book')}Beginner path${icon('next', 'chevron')}</summary>
        <ol class="nav-list module-list">${modules.map(({ title }, i) =>
          '<li><a class="nav-row" href="#module-' + (i + 1) + '"><span class="module-number" aria-hidden="true">' +
          String(i + 1).padStart(2, '0') + '</span>' + escapeHtml(title) + '</a></li>').join('')}</ol>
      </details>
    </div>`;
}

}

function roadmapContent() {
  return `<div class="roadmap">
    <section class="path-overview" aria-labelledby="path-title">
      <h2 id="path-title">Beginner path</h2>
      <p>Redesign a fictional clinic booking flow. Each module adds a piece of work you can use in your final case study.</p>
      <ul class="path-facts">
        <li><strong>8</strong> modules</li>
        <li><strong>1</strong> portfolio project</li>
        <li>No prior design experience required</li>
      </ul>
    </section>
    <section aria-labelledby="modules-title">
      <h2 id="modules-title">What you’ll learn</h2>
      <div class="checkpoint-map">
        <div class="checkpoint-field">
          <svg class="checkpoint-track" aria-hidden="true" focusable="false">
            <path class="track-line"></path><path class="track-pulse" pathLength="100"></path>
          </svg>
          <ol class="checkpoints" aria-label="Module checkpoints">
            ${modules.map((module, i) => `<li>
              <button type="button" class="checkpoint" aria-controls="checkpoint-detail-${i + 1}">
                <span class="checkpoint-number">${String(i + 1).padStart(2, '0')}</span>
                <span class="checkpoint-label">${escapeHtml(module.title)}</span>
              </button>
            </li>`).join('')}
          </ol>
        </div>
        <div class="checkpoint-details">
          ${modules.map((module, i) => `<article class="checkpoint-detail" id="checkpoint-detail-${i + 1}" aria-labelledby="checkpoint-title-${i + 1}">
            <div><p class="detail-index">Module ${i + 1} of ${modules.length}</p><h3 id="checkpoint-title-${i + 1}">${escapeHtml(module.title)}</h3></div>
            <p class="detail-skills">${escapeHtml(module.skills)}</p>
            <p class="detail-work"><strong>Project work</strong><span>${escapeHtml(module.deliverable)}</span></p>
            <a class="course-cta" href="#module-${i + 1}" aria-label="Open module: ${escapeHtml(module.title)}">Open module ${icon('next')}</a>
          </article>`).join('')}
        </div>
      </div>
    </section>
    <section class="curriculum-notes" aria-label="Curriculum references">
      <details>
        <summary>${icon('next', 'chevron')}Curriculum references</summary>
        <p>University curricula informed the sequence. The clinic project and assignments are specific to this course.</p>
        <ul>${curriculumReferences.map(([school, title, url]) =>
          `<li>${school} · <a href="${url}">${escapeHtml(title)}</a></li>`).join('')}</ul>
      </details>
    </section>
  </div>`;
}

function drawCheckpointTrack(field) {
  const bounds = field.getBoundingClientRect();
  const points = [...field.querySelectorAll('.checkpoint-number')].map(marker => {
    const rect = marker.getBoundingClientRect();
    return [rect.left + rect.width / 2 - bounds.left, rect.top + rect.height / 2 - bounds.top];
  });
  let path = 'M ' + points[0].join(' ');
  for (let i = 1; i < points.length; i++) {
    const [previousX, previousY] = points[i - 1];
    const [x, y] = points[i];
    if (Math.abs(x - previousX) < 1) {
      const outside = x + (x > bounds.width / 2 ? 44 : -44);
      const middleY = (previousY + y) / 2;
      path += ` C ${outside} ${previousY}, ${outside} ${middleY}, ${outside} ${middleY}`;
      path += ` S ${outside} ${y}, ${x} ${y}`;
    } else {
      const middleX = (previousX + x) / 2;
      path += ` C ${middleX} ${previousY}, ${middleX} ${y}, ${x} ${y}`;
    }
  }
  field.querySelectorAll('.checkpoint-track path').forEach(stroke => stroke.setAttribute('d', path));
}

let trackObserver;

function initCheckpoints(content) {
  const field = content.querySelector('.checkpoint-field');
  const buttons = [...field.querySelectorAll('.checkpoint')];
  const cards = [...content.querySelectorAll('.checkpoint-detail')];
  let selected = 0;

  function select(index) {
    selected = index;
    buttons.forEach((button, i) => {
      const active = i === selected;
      if (active) button.setAttribute('aria-current', 'true');
      else button.removeAttribute('aria-current');
      cards[i].classList.toggle('is-active', active);
    });
  }

  buttons.forEach((button, index) => {
    button.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse' && !cards[selected].querySelector('.course-cta').matches(':focus-visible')) select(index);
    });
    button.addEventListener('focus', () => select(index));
    button.addEventListener('click', () => {
      select(index);
      cards[index].querySelector('.course-cta').focus({preventScroll:true});
      cards[index].scrollIntoView({block:'nearest'});
    });
  });
  select(0);
  drawCheckpointTrack(field);
  trackObserver = new ResizeObserver(() => drawCheckpointTrack(field));
  trackObserver.observe(field);
}

let foundationLessons = [], foundationQuiz = [], foundationRubric = [], foundationBrief = '';
const foundationStorage = () => 'ux-learning:foundations:v2:' + activeUser;
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
function readingLink(value) {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' ? escapeHtml(url.href) : '#';
  } catch { return '#'; }
}

function readFoundationProgress() {
  try {
    return JSON.parse(localStorage.getItem(foundationStorage())) || {};
  } catch {
    return {};
  }
}

function initFoundations(content) {
  const saved = readFoundationProgress();
  const state = {
    step: Number.isInteger(saved.step) && saved.step >= 0 && saved.step <= 4 ? saved.step : 0,
    lessons: Array.from({length:3}, (_, i) => saved.lessons?.[i] === true),
    quiz: Array.isArray(saved.quiz) && saved.quiz.length === 5 &&
      saved.quiz.every(answer => Number.isInteger(answer) && answer >= 0 && answer <= 2) ? saved.quiz : [],
    draft: typeof saved.draft === 'string' ? saved.draft : '',
    revision: typeof saved.revision === 'string' ? saved.revision : '',
    rubric: Array.from({length:5}, (_, i) => [0,1,2].includes(saved.rubric?.[i]) ? saved.rubric[i] : null)
  };
  const steps = ['Task and goals', 'Observe friction', 'Propose and test', 'Knowledge check', 'Clinic critique'];
  content.innerHTML = `<div class="foundation">
    <section class="foundation-overview" aria-labelledby="foundation-outcome">
      <h2 id="foundation-outcome">Write your first UX critique</h2>
      <p>Use observable evidence to improve a clinic booking flow, then decide how you would test your change.</p>
      <p><strong>3 lessons · 1 knowledge check · 1 assignment · About 90 minutes</strong></p>
      <label class="foundation-progress"><span id="foundation-progress-label"></span><progress max="5" value="0"></progress></label>
    </section>
    <ol class="foundation-steps" aria-label="Module steps">
      ${steps.map((name, index) => `<li><button type="button" data-step="${index}">${name}</button></li>`).join('')}
    </ol>
    <section class="foundation-panel" aria-labelledby="foundation-step-title"></section>
    <p class="foundation-status" role="status"></p>
  </div>`;
  const panel = content.querySelector('.foundation-panel');
  const status = content.querySelector('.foundation-status');
  const stepButtons = [...content.querySelectorAll('[data-step]')];

  function updateProgress() {
    const assignmentDone = state.draft.trim() && state.revision.trim() && state.rubric.every(n => n !== null);
    const count = state.lessons.filter(Boolean).length + Number(state.quiz.length > 0) + Number(Boolean(assignmentDone));
    content.querySelector('progress').value = count;
    content.querySelector('#foundation-progress-label').textContent = count + ' of 5 steps complete';
  }

  function save(message = '') {
    updateProgress();
    try {
      localStorage.setItem(foundationStorage(), JSON.stringify(state));
      status.textContent = message;
    } catch {
      status.textContent = 'Browser storage is unavailable. Progress is kept until you leave this module.';
    }
  }

  function quizFeedback(form) {
    const score = foundationQuiz.filter((question, index) => state.quiz[index] === question[2]).length;
    form.querySelector('output').textContent = 'Score: ' + score + ' of ' + foundationQuiz.length;
    foundationQuiz.forEach(([, options, correct, explanation], index) => {
      form.querySelectorAll('.quiz-feedback')[index].textContent =
        (state.quiz[index] === correct ? 'Correct. ' : 'Correct answer: ' + options[correct] + ' ') + explanation;
    });
  }

  function showStep(moveFocus = false) {
    stepButtons.forEach((button, index) => {
      if (index === state.step) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    });
    if (state.step < 3) {
      const lesson = foundationLessons[state.step];
      panel.innerHTML = `<p>Lesson ${state.step + 1} of 3</p>
        <h2 id="foundation-step-title" tabindex="-1">${escapeHtml(lesson.title)}</h2>
        <p>${escapeHtml(lesson.body)}</p>
        <div class="foundation-practice"><strong>Try it</strong><p>${escapeHtml(lesson.practice)}</p></div>
        <div class="foundation-reading">${lesson.readings.map(([label, title, url, notes]) =>
          `<p><strong>${escapeHtml(label)}</strong> · <a href="${readingLink(url)}" target="_blank" rel="noopener">${escapeHtml(title)}</a><br>${escapeHtml(notes)}</p>`).join('')}</div>
        <button type="button" class="course-cta" data-lesson-complete>${state.lessons[state.step] ? 'Continue' : 'Mark complete and continue'}</button>`;
    } else if (state.step === 3) {
      panel.innerHTML = `<h2 id="foundation-step-title" tabindex="-1">Knowledge check</h2>
        <p>Answer all five questions to see your score and explanations.</p>
        <form data-quiz>
          ${foundationQuiz.map(([question, options], index) => `<fieldset>
            <legend>${index + 1}. ${escapeHtml(question)}</legend>
            ${options.map((option, choice) => `<label class="quiz-option"><input type="radio" name="question-${index}" value="${choice}" required ${state.quiz[index] === choice ? 'checked' : ''}> ${escapeHtml(option)}</label>`).join('')}
            <p class="quiz-feedback"></p>
          </fieldset>`).join('')}
          <button type="submit" class="course-cta">Check answers</button>
          <output aria-live="polite"></output>
        </form>`;
      if (state.quiz.length) quizFeedback(panel.querySelector('form'));
    } else {
      panel.innerHTML = foundationAssignment();
      panel.querySelector('#critique-draft').value = state.draft;
      panel.querySelector('#critique-revision').value = state.revision;
      panel.querySelectorAll('[data-rubric]').forEach((select, index) => {
        select.value = state.rubric[index] ?? '';
      });
      updateRubricScore(panel, state.rubric);
    }
    if (moveFocus) panel.querySelector('h2').focus();
  }

  stepButtons.forEach((button, index) => button.addEventListener('click', () => {
    state.step = index;
    save();
    showStep(true);
  }));

  panel.addEventListener('click', event => {
    if (!event.target.closest('[data-lesson-complete]')) return;
    state.lessons[state.step] = true;
    state.step += 1;
    save('Lesson marked complete.');
    showStep(true);
  });

  panel.addEventListener('submit', event => {
    if (!event.target.matches('[data-quiz]')) return;
    event.preventDefault();
    const answers = new FormData(event.target);
    state.quiz = foundationQuiz.map((_, index) => Number(answers.get('question-' + index)));
    quizFeedback(event.target);
    save();
  });

  panel.addEventListener('input', event => {
    const field = event.target;
    if (field.id === 'critique-draft') state.draft = field.value;
    else if (field.id === 'critique-revision') state.revision = field.value;
    else if (field.matches('[data-rubric]')) {
      state.rubric[Number(field.dataset.rubric)] = field.value === '' ? null : Number(field.value);
      updateRubricScore(panel, state.rubric);
    } else return;
    save('Saved in this browser.');
  });

  updateProgress();
  showStep();
}

function updateRubricScore(panel, ratings) {
  const count = ratings.filter(n => n !== null).length;
  panel.querySelector('#rubric-score').textContent = count < ratings.length
    ? count + ' of ' + ratings.length + ' criteria scored'
    : 'Self-review score: ' + ratings.reduce((total, rating) => total + rating, 0) + ' of 10';
}

function foundationAssignment() {
  return `<h2 id="foundation-step-title" tabindex="-1">Critique a clinic booking flow</h2>
    <details class="foundation-example" open>
      <summary>Assignment brief and worked example</summary>
      <div class="assignment-brief">${escapeHtml(foundationBrief.split('### Self-assessment')[0]).replace(/^### /gm,'').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</div>
    </details>
    <div><label for="critique-draft"><strong>Your critique</strong></label><textarea id="critique-draft" rows="8" placeholder="Patient goal, clinic goal, findings, priority, and test"></textarea></div>
    <h3>Self-review rubric</h3>
    <p>Score each criterion, then revise your lowest-scoring area and describe what changed.</p>
    ${foundationRubric.map(([criterion, ...ratings], index) => `<div>
      <label for="rubric-${index}"><strong>${escapeHtml(criterion)}</strong></label>
      <select id="rubric-${index}" data-rubric="${index}">
        <option value="">Choose a score</option>
        ${ratings.map((rating, score) => `<option value="${score}">${score} · ${escapeHtml(rating)}</option>`).join('')}
      </select>
    </div>`).join('')}
    <output id="rubric-score" aria-live="polite"></output>
    <div><label for="critique-revision"><strong>What did you revise?</strong></label><textarea id="critique-revision" rows="3"></textarea></div>`;
}

function render(focus = false) {
  const route = location.hash.slice(1);
  const key = pages.has(route) ? route : 'dashboard';
  const [title, description] = pages.get(key);
  document.title = title + ' | UI/UX Learning';
  main.querySelector('h1').textContent = title;
  main.querySelector('#page-description').textContent = description;
  const content = main.querySelector('#page-content');
  trackObserver?.disconnect();
  if (key === 'roadmap') {
    content.innerHTML = roadmapContent();
    initCheckpoints(content);
  } else if (key === 'module-1') {
    initFoundations(content);
  } else if (key.startsWith('module-')) {
    const module = modules[Number(key.slice(7)) - 1];
    content.innerHTML = `<section class="roadmap module-plan" aria-label="Module plan">
      <p><strong>Project work</strong> · ${escapeHtml(module.deliverable)}</p>
      <p>Lessons and assignments are planned for a future release.</p>
      <a href="#roadmap">Back to course roadmap</a>
    </section>`;
  } else {
    content.replaceChildren();
  }
  const breadcrumb = main.querySelector('.breadcrumb');
  breadcrumb.replaceChildren(document.createTextNode(key.startsWith('module-') ? 'Beginner path' : 'Workspace'));
  breadcrumb.insertAdjacentHTML('beforeend', icon('next'));
  breadcrumb.append(document.createTextNode(key.startsWith('module-') ? 'Module ' + key.slice(7) : title));
  document.querySelectorAll('.nav-row[href], .top-link').forEach(link => {
    if (link.hash === '#' + key) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  if (key.startsWith('module-')) {
    navigation.forEach(nav => { nav.querySelector('details').open = true; });
  }
  if (focus) main.focus();
}

document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  main.focus();
});
trigger.addEventListener('click', () => {
  drawer.showModal();
  trigger.setAttribute('aria-expanded', 'true');
});
drawer.addEventListener('close', () => trigger.setAttribute('aria-expanded', 'false'));
drawer.addEventListener('click', event => {
  const link = event.target.closest('a');
  if (link) {
    drawer.close();
    if (link.hash === location.hash) main.focus();
  } else if (event.target === drawer && event.clientX > drawer.getBoundingClientRect().right) {
    drawer.close();
  }
});
mobile.addEventListener('change', () => {
  if (!mobile.matches && drawer.open) {
    drawer.close();
    main.focus();
  }
});
const login = document.querySelector('#login');
const loginForm = login.querySelector('form');
const loginStatus = login.querySelector('[role="status"]');
const callbackParams = new URLSearchParams(location.hash.slice(1));
if (callbackParams.has('error_code') || callbackParams.has('error')) {
  loginStatus.textContent = callbackParams.get('error_code') === 'otp_expired'
    ? 'This sign-in link has expired or was already used. Request a new link below.'
    : 'This sign-in link could not be verified. Request a new link below.';
  history.replaceState(null, '', location.pathname + location.search);
}
const exit = document.querySelector('#sign-out');
const chrome = [...document.querySelectorAll('.skip, .top, .shell')];
chrome.forEach(node => node.hidden = true);

let authClient;
let activeUser;
let accessRequest = 0;
let signedIn = false;

function lockCourse() {
  signedIn = false;
  activeUser = undefined;
  modules = [];
  pages.clear();
  foundationLessons = foundationQuiz = foundationRubric = [];
  foundationBrief = '';
  trackObserver?.disconnect();
  if (drawer.open) drawer.close();
  navigation.forEach(nav => nav.replaceChildren());
  main.querySelector('#page-content').replaceChildren();
  main.querySelector('#page-description').textContent = '';
  main.querySelector('h1').textContent = 'Dashboard';
  main.querySelector('.breadcrumb').replaceChildren();
  document.title = 'Sign in | UI/UX Learning';
  chrome.forEach(node => node.hidden = true);
  login.hidden = false;
}

async function openCourse(session) {
  const request = ++accessRequest;
  if (!session) {
    lockCourse();
    return;
  }
  if (signedIn && activeUser === session.user.id) return;
  lockCourse();
  loginStatus.textContent = 'Checking course access…';
  const {data, error} = await authClient.rpc('ux_read_course', {course_slug:'ux-foundations'});
  if (request !== accessRequest) return;
  if (error || !data?.content) {
    loginStatus.textContent = error ? 'Course access could not be checked. Try signing in again.' : 'This email does not have course access. Contact your administrator.';
    return;
  }
  activeUser = session.user.id;
  modules = data.content.modules;
  ({lessons:foundationLessons,quiz:foundationQuiz,rubric:foundationRubric,assignment:foundationBrief} = data.content.foundations);
  pages = buildPages();
  buildNavigation();
  signedIn = true;
  render();
  chrome.forEach(node => node.hidden = false);
  login.hidden = true;
  main.focus();
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (!authClient) return;
  const button = loginForm.querySelector('button');
  button.disabled = true;
  loginStatus.textContent = 'Sending sign-in link…';
  try {
    const email = loginForm.elements.email.value.trim();
    const {error} = await authClient.auth.signInWithOtp({
      email, options:{emailRedirectTo:location.origin + location.pathname}
    });
    loginStatus.textContent = error ? 'The sign-in link could not be sent. Check your email and try again.' : 'Check your email for a sign-in link.';
  } catch {
    loginStatus.textContent = 'The sign-in service is unavailable. Try again shortly.';
  } finally {
    button.disabled = false;
  }
});

exit.addEventListener('click', async () => {
  const {error} = await authClient.auth.signOut({scope:'local'});
  if (error) {
    window.alert('Sign-out failed. Please try again.');
    return;
  }
  loginForm.reset();
  loginStatus.textContent = 'Signed out.';
  loginForm.elements.email.focus();
});

window.addEventListener('hashchange', () => { if (signedIn) render(true); });
(async () => {
  try {
    const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm');
    authClient = createClient('https://jtgcwjfkelxftjybioyq.supabase.co','sb_publishable_fDjsecIngPu_5VucEp9GcQ_noiTi7-v');
    authClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        accessRequest++;
        lockCourse();
      } else if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
        setTimeout(() => openCourse(session).catch(() => {
          loginStatus.textContent = 'The course could not be loaded. Try reloading.';
        }),0);
      }
    });
    loginForm.querySelector('button').disabled = false;
  } catch {
    loginStatus.textContent = 'The sign-in service is unavailable. Try reloading.';
  }
})();

</script>
</body>
