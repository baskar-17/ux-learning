<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Navigation for the UI/UX learning workspace">
<title>UI/UX Learning</title>
<style>
:root {
  --blue-700:#1868db; --blue-800:#0055cc; --blue-900:#09326c;
  --white:#fff; --surface:#f7f8f9; --border:#dcdfe4;
  --text:#172b4d; --muted:#44546f; --selected:#e9f2ff;
  --space-100:8px; --space-200:16px; --space-300:24px; --space-400:32px;
  --rail:280px; --header:64px;
  font:400 14px/20px "Atlassian Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--white); }
a { color:var(--blue-700); }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--blue-700); outline-offset:2px; }
.skip { position:fixed; z-index:5; top:8px; left:8px; padding:8px 16px; background:var(--white); transform:translateY(-150%); }
.skip:focus { transform:none; }
.icons { position:absolute; width:0; height:0; overflow:hidden; }
.icon { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.top { height:var(--header); position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--white); }
.top-start,.brand,.top-link { display:flex; align-items:center; gap:8px; text-decoration:none; }
.brand { gap:12px; font-size:16px; font-weight:600; color:var(--text); }
.brand-mark { display:grid; place-items:center; width:32px; height:32px; border-radius:6px; background:var(--blue-700); color:var(--white); }
.top-link { min-height:44px; padding:0 8px; border-radius:4px; font-weight:500; color:var(--muted); }
.top-link:hover { background:var(--surface); color:var(--blue-800); }
.top-link[aria-current="page"] { color:var(--blue-900); background:var(--selected); }
.icon-button { display:grid; place-items:center; width:44px; height:44px; border:0; border-radius:4px; background:transparent; color:var(--muted); }
.icon-button:hover { background:var(--surface); }
.menu-trigger { display:none; }
.shell { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:calc(100dvh - var(--header)); }
.rail { position:sticky; top:var(--header); align-self:start; height:calc(100dvh - var(--header)); overflow:auto; background:var(--surface); border-right:1px solid var(--border); }
.rail nav { padding:24px 16px; }
.group + .group { border-top:1px solid var(--border); margin-top:24px; padding-top:24px; }
.group-title { margin:0 8px 8px; color:var(--muted); font-size:12px; line-height:16px; font-weight:600; }
.nav-list { list-style:none; padding:0; margin:0; }
.nav-row { position:relative; display:flex; align-items:center; gap:8px; min-height:44px; padding:8px; border-radius:4px; color:var(--text); text-decoration:none; }
.nav-row:hover { background:#eef0f2; }
.nav-row[aria-current="page"] { background:var(--selected); color:var(--blue-900); font-weight:600; }
.nav-row[aria-current="page"]::before { content:""; position:absolute; inset:8px auto 8px 0; width:3px; border-radius:2px; background:var(--blue-700); }
summary { list-style:none; cursor:pointer; }
summary::-webkit-details-marker { display:none; }
summary .chevron { margin-left:auto; width:16px; height:16px; }
details[open] .chevron { transform:rotate(90deg); }
.module-list { margin:0 0 0 17px; padding-left:12px; border-left:1px solid var(--border); }
.module-list .nav-row { font-size:13px; }
.module-number { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
main { padding:40px clamp(16px,5vw,72px); }
.breadcrumb { display:flex; align-items:center; flex-wrap:wrap; gap:8px; color:var(--muted); margin-bottom:16px; }
.breadcrumb .icon { width:12px; height:12px; }
h1 { font-size:29px; line-height:32px; font-weight:600; margin:0 0 8px; }
main p { margin:0; color:var(--muted); }
.roadmap { max-width:920px; margin-top:24px; }
.path-overview { padding:24px; border:1px solid var(--border); border-top:3px solid var(--blue-700); border-radius:8px; background:var(--surface); }
.roadmap h2 { margin:0 0 8px; font-size:20px; line-height:24px; font-weight:500; }
.path-overview p { max-width:64ch; }
.path-facts { display:flex; flex-wrap:wrap; gap:8px 24px; padding:0; margin:16px 0 0; list-style:none; font-size:12px; }
.path-facts li { color:var(--muted); }
.path-facts strong { color:var(--text); }
.roadmap section + section { margin-top:32px; }
.checkpoint-map {
  --grid:rgba(24,104,219,.10);
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(248px,32%);
  align-items:center;
  gap:24px;
  padding:24px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:8px;
  background:#f4f8ff;
}
.checkpoint-map::before,.checkpoint-map::after { content:""; position:absolute; pointer-events:none; z-index:-1; }
.checkpoint-map::before {
  inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(112deg,#000,rgba(0,0,0,.25));
}
.checkpoint-map::after {
  inset:-30%;
  background:radial-gradient(ellipse at 30% 45%,rgba(89,153,255,.23),transparent 37%),radial-gradient(ellipse at 67% 62%,rgba(89,153,255,.12),transparent 32%);
  animation:map-drift 16s ease-in-out infinite alternate;
}
@keyframes map-drift { to { transform:translate3d(8%,-7%,0); opacity:.6; } }
.checkpoints { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:32px 8px; padding:0; margin:0; list-style:none; }
.checkpoints li:nth-child(even) { transform:translateY(12px); }
.checkpoint { display:grid; justify-items:center; align-content:start; gap:8px; width:100%; min-height:104px; padding:4px; border:0; border-radius:6px; background:transparent; text-align:center; }
.checkpoint-number { display:grid; place-items:center; width:44px; height:44px; border:1px solid #85b8ff; border-radius:12px; background:var(--white); color:var(--blue-900); font-weight:600; font-variant-numeric:tabular-nums; box-shadow:0 2px 6px rgba(9,50,108,.10); transition:background .16s,color .16s,transform .16s; }
.checkpoint-label { font-size:12px; line-height:16px; font-weight:500; overflow-wrap:anywhere; }
.checkpoint[aria-current="true"] .checkpoint-number { background:var(--blue-900); border-color:var(--blue-900); color:var(--white); box-shadow:0 0 0 4px rgba(24,104,219,.16); }
.checkpoint:hover .checkpoint-number { transform:translateY(-2px); }
.checkpoint-detail { align-self:stretch; display:grid; align-content:center; gap:16px; min-height:280px; padding:24px; background:var(--white); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(9,50,108,.09); }
.checkpoint-detail h3 { margin:4px 0 0; font-size:20px; line-height:24px; font-weight:500; }
.checkpoint-detail .detail-index { font-size:12px; line-height:16px; font-weight:600; }
.detail-work { border-top:1px solid var(--border); padding-top:12px; }
.detail-work strong { display:block; color:var(--text); font-size:12px; }
.course-cta { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 16px; color:var(--white); background:var(--blue-700); border-radius:4px; text-decoration:none; font-weight:600; }
.course-cta:hover { background:var(--blue-800); }
.course-cta:active { background:var(--blue-900); }
@media (max-width:1120px) {
  .checkpoint-map { grid-template-columns:minmax(0,1fr); }
  .checkpoint-detail { min-height:0; }
}
@media (max-width:480px) {
  .checkpoint-map { padding:16px; gap:16px; }
  .checkpoints { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .checkpoints li:nth-child(even) { transform:none; }
  .checkpoint { min-height:80px; }
  .checkpoint-detail { padding:16px; }
}
@media (prefers-reduced-motion:reduce) {
  .checkpoint-map::after { animation:none; }
  .checkpoint-number { transition:none; }
  .checkpoint:hover .checkpoint-number { transform:none; }
}
.curriculum-notes { border-top:1px solid var(--border); padding-top:16px; }
.curriculum-notes summary { display:flex; align-items:center; gap:8px; min-height:44px; font-weight:600; width:fit-content; }
.curriculum-notes ul { padding-left:20px; display:grid; gap:8px; }
.module-plan { display:grid; gap:16px; max-width:640px; }
.module-plan a { width:fit-content; }
@media (max-width:480px) {
  .path-overview { padding:16px; }
}
dialog { position:fixed; inset:0 auto 0 0; margin:0; padding:0; border:0; width:min(320px,calc(100% - 32px)); height:100%; max-height:none; max-width:none; background:var(--surface); color:var(--text); }
dialog[open] { display:flex; flex-direction:column; }
dialog::backdrop { background:rgb(9 30 66 / 50%); }
.drawer-head { flex:none; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; background:var(--white); border-bottom:1px solid var(--border); }
.drawer-head h2 { margin:0; font-size:20px; line-height:24px; font-weight:500; }
dialog nav { padding:16px; overflow:auto; }
body:has(dialog[open]) { overflow:hidden; }
@media (max-width:767px) {
  .top { padding:0 8px; }
  .top-start { gap:4px; }
  .menu-trigger { display:grid; }
  .shell { display:block; }
  .rail { display:none; }
  main { padding:24px 16px; }
}
</style>
</head>
<body>
<svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="book" viewBox="0 0 24 24"><path d="M12 5.5C9 3.5 5.5 3.5 3 4v14c3-.5 6-.5 9 1.5 3-2 6-2 9-1.5V4c-2.5-.5-6-.5-9 1.5Zm0 0v14"/></symbol>
  <symbol id="dashboard" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  <symbol id="course" viewBox="0 0 24 24"><path d="M3 6h3m-3 6h3m-3 6h3M9 6h12M9 12h12M9 18h12"/></symbol>
  <symbol id="resources-icon" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8m-8 4h8m-8 4h5"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-start">
    <button class="icon-button menu-trigger" type="button" aria-label="Open navigation" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#menu"/></svg></button>
    <a class="brand" href="#dashboard"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#book"/></svg></span>UI/UX Learning</a>
  </div>
  <a class="top-link" href="#resources"><svg class="icon" aria-hidden="true"><use href="#resources-icon"/></svg>Resources</a>
</header>
<div class="shell">
  <aside class="rail"><nav aria-label="Course navigation"></nav></aside>
  <main id="main" tabindex="-1">
    <div class="breadcrumb" aria-label="Current location"></div>
    <h1>Dashboard</h1>
    <p id="page-description"></p>
    <div id="page-content"></div>
  </main>
</div>
<dialog id="drawer" aria-labelledby="drawer-title">
  <header class="drawer-head"><h2 id="drawer-title">Navigation</h2><form method="dialog"><button type="submit" class="icon-button" aria-label="Close navigation" autofocus><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button></form></header>
  <nav aria-label="Course navigation"></nav>
</dialog>
<script>
const modules = [
  { title: 'UX foundations and product critique', skills: 'Define a user task, identify usability problems, and prioritize what to fix.', deliverable: 'A critique of the clinic booking flow' },
  { title: 'Research and synthesis', skills: 'Plan interviews, observe behavior, and group findings into themes.', deliverable: 'A research plan and evidence-backed synthesis' },
  { title: 'Problem framing and flows', skills: 'Frame the problem, explore alternatives, and map the main and recovery paths.', deliverable: 'A problem statement and booking flow' },
  { title: 'Wireframes and interaction', skills: 'Sketch layout options and wireframe navigation, forms, and error states.', deliverable: 'Low-fidelity booking and rescheduling screens' },
  { title: 'Visual and responsive UI', skills: 'Use type, spacing, color, and layout to guide attention across screen sizes.', deliverable: 'Mobile and desktop screens' },
  { title: 'Components and accessibility', skills: 'Design reusable components with states, keyboard behavior, and accessible labels.', deliverable: 'A small component set and accessibility review' },
  { title: 'Prototyping and usability testing', skills: 'Build a clickable prototype, observe people completing tasks, and iterate.', deliverable: 'A prototype, test findings, and revisions' },
  { title: 'Handoff and portfolio', skills: 'Specify behavior for developers and explain design decisions with evidence.', deliverable: 'Handoff notes and a portfolio case study' }
];

const curriculumReferences = [
  ['University of Michigan', 'User Experience Research and Design', 'https://online.umich.edu/series/user-experience-research-and-design/'],
  ['Stanford d.school', 'Design Thinking Bootleg', 'https://dschool.stanford.edu/tools/design-thinking-bootleg'],
  ['Carnegie Mellon HCII', 'User-Centered Research and Evaluation', 'https://www.hcii.cmu.edu/course/user-centered-research-and-evaluation-ucre'],
  ['Google', 'UX Design Certificate curriculum', 'https://grow.google/certificates/ux-design/']
];
const pages = new Map([
  ['dashboard', ['Dashboard', 'The dashboard is the next build.']],
  ['roadmap', ['Course roadmap', 'Go from your first usability critique to a tested design and portfolio case study.']],
  ['resources', ['Resources', 'The resource library will be added with the course content.']],
  ...modules.map(({ title, skills }, index) => ['module-' + (index + 1), [title, skills]])
]);
const icon = (id, extra = '') => '<svg class="icon ' + extra + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
const navigation = document.querySelectorAll('nav');
const main = document.querySelector('main');
const drawer = document.querySelector('dialog');
const trigger = document.querySelector('.menu-trigger');
const mobile = matchMedia('(max-width: 767px)');

for (const nav of navigation) {
  nav.innerHTML = `
    <div class="group">
      <p class="group-title">Workspace</p>
      <ul class="nav-list">
        <li><a class="nav-row" href="#dashboard">${icon('dashboard')}Dashboard</a></li>
        <li><a class="nav-row" href="#roadmap">${icon('course')}Course roadmap</a></li>
      </ul>
    </div>
    <div class="group">
      <p class="group-title">Course outline</p>
      <details open>
        <summary class="nav-row">${icon('book')}Beginner path${icon('next', 'chevron')}</summary>
        <ol class="nav-list module-list">${modules.map(({ title }, i) =>
          '<li><a class="nav-row" href="#module-' + (i + 1) + '"><span class="module-number" aria-hidden="true">' +
          String(i + 1).padStart(2, '0') + '</span>' + title + '</a></li>').join('')}</ol>
      </details>
    </div>`;
}

function roadmapContent() {
  return `<div class="roadmap">
    <section class="path-overview" aria-labelledby="path-title">
      <h2 id="path-title">Beginner path</h2>
      <p>Redesign a fictional clinic booking flow. Each module adds a piece of work you can use in your final case study.</p>
      <ul class="path-facts">
        <li><strong>8</strong> modules</li>
        <li><strong>1</strong> portfolio project</li>
        <li>No prior design experience required</li>
      </ul>
    </section>
    <section aria-labelledby="modules-title">
      <h2 id="modules-title">What you’ll learn</h2>
      <div class="checkpoint-map">
        <ol class="checkpoints" aria-label="Module checkpoints">
          ${modules.map((module, i) => `<li>
            <button type="button" class="checkpoint" data-module="${i}" aria-controls="checkpoint-detail">
              <span class="checkpoint-number">${String(i + 1).padStart(2, '0')}</span>
              <span class="checkpoint-label">${module.title}</span>
            </button>
          </li>`).join('')}
        </ol>
        <article class="checkpoint-detail" id="checkpoint-detail" aria-labelledby="checkpoint-title">
          <div><p class="detail-index"></p><h3 id="checkpoint-title"></h3></div>
          <p class="detail-skills"></p>
          <p class="detail-work"><strong>Project work</strong><span></span></p>
          <a class="course-cta" href="#module-1">Open module ${icon('next')}</a>
        </article>
      </div>
    </section>
    <section class="curriculum-notes" aria-label="Curriculum references">
      <details>
        <summary>${icon('next', 'chevron')}Curriculum references</summary>
        <p>University curricula informed the sequence. The clinic project and assignments are specific to this course.</p>
        <ul>${curriculumReferences.map(([school, title, url]) =>
          `<li>${school} · <a href="${url}">${title}</a></li>`).join('')}</ul>
      </details>
    </section>
  </div>`;
}

function initCheckpoints(content) {
  const buttons = [...content.querySelectorAll('.checkpoint')];
  const card = content.querySelector('.checkpoint-detail');
  const cta = card.querySelector('.course-cta');

  function select(index) {
    const module = modules[index];
    buttons.forEach((button, i) => {
      if (i === index) button.setAttribute('aria-current', 'true');
      else button.removeAttribute('aria-current');
    });
    card.querySelector('.detail-index').textContent = 'Module ' + (index + 1) + ' of ' + modules.length;
    card.querySelector('h3').textContent = module.title;
    card.querySelector('.detail-skills').textContent = module.skills;
    card.querySelector('.detail-work span').textContent = module.deliverable;
    cta.hash = 'module-' + (index + 1);
    cta.setAttribute('aria-label', 'Open module: ' + module.title);
  }

  buttons.forEach((button, index) => {
    button.addEventListener('pointerenter', event => {
      if (event.pointerType === 'mouse' && !cta.matches(':focus-visible')) select(index);
    });
    button.addEventListener('focus', () => select(index));
    button.addEventListener('click', () => {
      select(index);
      cta.focus({preventScroll:true});
      card.scrollIntoView({block:'nearest'});
    });
  });
  select(0);
}

function render(focus = false) {
  const route = location.hash.slice(1);
  const key = pages.has(route) ? route : 'dashboard';
  const [title, description] = pages.get(key);
  document.title = title + ' | UI/UX Learning';
  main.querySelector('h1').textContent = title;
  main.querySelector('#page-description').textContent = description;
  const content = main.querySelector('#page-content');
  if (key === 'roadmap') {
    content.innerHTML = roadmapContent();
    initCheckpoints(content);
  } else if (key.startsWith('module-')) {
    const module = modules[Number(key.slice(7)) - 1];
    content.innerHTML = `<section class="roadmap module-plan" aria-label="Module plan">
      <p><strong>Project work</strong> · ${module.deliverable}</p>
      <p>Lessons and assignments are planned for a future release.</p>
      <a href="#roadmap">Back to course roadmap</a>
    </section>`;
  } else {
    content.replaceChildren();
  }
  const breadcrumb = main.querySelector('.breadcrumb');
  breadcrumb.replaceChildren(document.createTextNode(key.startsWith('module-') ? 'Beginner path' : 'Workspace'));
  breadcrumb.insertAdjacentHTML('beforeend', icon('next'));
  breadcrumb.append(document.createTextNode(key.startsWith('module-') ? 'Module ' + key.slice(7) : title));
  document.querySelectorAll('.nav-row[href], .top-link').forEach(link => {
    if (link.hash === '#' + key) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  if (key.startsWith('module-')) {
    navigation.forEach(nav => { nav.querySelector('details').open = true; });
  }
  if (focus) main.focus();
}

document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  main.focus();
});
trigger.addEventListener('click', () => {
  drawer.showModal();
  trigger.setAttribute('aria-expanded', 'true');
});
drawer.addEventListener('close', () => trigger.setAttribute('aria-expanded', 'false'));
drawer.addEventListener('click', event => {
  const link = event.target.closest('a');
  if (link) {
    drawer.close();
    if (link.hash === location.hash) main.focus();
  } else if (event.target === drawer && event.clientX > drawer.getBoundingClientRect().right) {
    drawer.close();
  }
});
mobile.addEventListener('change', () => {
  if (!mobile.matches && drawer.open) {
    drawer.close();
    main.focus();
  }
});
window.addEventListener('hashchange', () => render(true));
render();
</script>
</body>
</html>
